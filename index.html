<!DOCTYPE html>
<html lang="es">
<head>
<link rel="apple-touch-icon" href="PHOTO-2026-10-11-21-15-58.jpg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control QR 3B</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:18px;background:#f4f6f8}
.contenedor{max-width:520px;margin:auto;background:white;padding:20px;border-radius:16px}
h1{text-align:center;margin-top:0}
select,input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;font-size:17px;border-radius:10px}
select,input{border:1px solid #bbb}button{border:none;font-weight:bold;cursor:pointer}
#iniciar{background:#1a73e8;color:white}#deshacer{background:#f9ab00;color:#202124;display:none}
#finalizar{background:#d93025;color:white;display:none}#reader{margin-top:15px}
#estado{text-align:center;font-size:19px;font-weight:bold;min-height:30px;margin:15px 0}
#contador{text-align:center;font-size:18px;line-height:1.6;margin:10px}
.ayuda{text-align:center;font-size:14px;color:#5f6368;margin:8px 0 14px}
#aviso{font-size:13px;color:#805200;text-align:center}
</style>
</head>
<body>
<div class="contenedor">
<h1>📱 Control QR 3B</h1>
<select id="tipoRegistro" onchange="cambiarTipoRegistro()">
<option value="actividad">📚 REGISTRO DE ACTIVIDADES</option>
<option value="asistencia">✅ ASISTENCIA DIARIA</option>
</select>
<div id="camposActividad">
<select id="materia">
<option value="">Selecciona una materia</option>
<option>Español</option><option>Inglés</option><option>Artes</option><option>Matemáticas</option>
<option>Ciencias</option><option>Historia</option><option>Formación Cívica y Ética</option>
<option>Educación Física</option><option>Tecnología</option><option>Tutoría (Socioemocional)</option>
</select>
<input id="actividad" type="text" placeholder="Ejemplo: Actividad 1">
</div>
<button id="iniciar" onclick="iniciarRevision()">INICIAR REVISIÓN</button>
<div id="contador">Realizaron: 33 | No realizaron: 0</div>
<div class="ayuda" id="ayuda">Escanea únicamente a los alumnos que NO realizaron la actividad.</div>
<div id="estado"></div>
<div id="reader"></div>
<button id="deshacer" onclick="deshacerUltimo()">↩️ DESHACER ÚLTIMO ESCANEO</button>
<button id="finalizar" onclick="finalizarRevision()">FINALIZAR</button>
<div id="aviso"></div>
</div>
<script>
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxHWbTpCB8qg9mNOMI0rmif8D2OxiykphA63t79haJbUZxTe53T-d7uRTn7aAsEqfbx/exec';
const TOTAL_ALUMNOS = 33;
let lector = null;
let escaneados = new Set();
let ordenEscaneos = [];
let activo = false;
let bloqueado = false;
let enviando = false;
const el = id => document.getElementById(id);
const esAsistencia = () => el('tipoRegistro').value === 'asistencia';
function actualizarContador() {
  const faltantes = escaneados.size;
  const presentes = TOTAL_ALUMNOS - faltantes;
  el('contador').textContent = esAsistencia()
    ? 'Presentes: ' + presentes + ' | Faltas: ' + faltantes
    : 'Realizaron: ' + presentes + ' | No realizaron: ' + faltantes;
  el('deshacer').style.display = activo && ordenEscaneos.length ? 'block' : 'none';
}
function cambiarTipoRegistro() {
  if (activo || enviando) return;
  escaneados.clear(); ordenEscaneos = [];
  el('camposActividad').style.display = esAsistencia() ? 'none' : 'block';
  el('iniciar').textContent = esAsistencia() ? 'INICIAR PASE DE LISTA' : 'INICIAR REVISIÓN';
  el('ayuda').textContent = esAsistencia()
    ? 'Escanea únicamente a los alumnos que FALTARON. Para corregir el mismo día, vuelve a enviar la lista COMPLETA de quienes siguen ausentes.'
    : 'Escanea únicamente a los alumnos que NO realizaron la actividad.';
  el('estado').textContent = '';
  el('aviso').textContent = '';
  actualizarContador();
}
async function iniciarRevision() {
  if (activo || enviando) return;
  if (!esAsistencia()) {
    if (!el('materia').value) return alert('Selecciona una materia.');
    if (!el('actividad').value.trim()) return alert('Escribe el nombre de la actividad.');
  }
  escaneados.clear(); ordenEscaneos = [];
  activo = true; bloqueado = false;
  el('tipoRegistro').disabled = true;
  el('materia').disabled = true; el('actividad').disabled = true;
  el('iniciar').style.display = 'none'; el('finalizar').style.display = 'block';
  el('estado').textContent = 'Preparando cámara...';
  el('aviso').textContent = '';
  actualizarContador();
  try {
    lector = new Html5Qrcode('reader');
    await lector.start({facingMode:'environment'},
      {fps:10, qrbox:{width:250,height:250}}, codigoLeido);
    el('estado').textContent = esAsistencia()
      ? 'Escanea únicamente a quienes FALTARON'
      : 'Escanea únicamente a quien NO realizó';
  } catch (error) {
    activo = false;
    el('estado').textContent = 'No se pudo abrir la cámara: ' + error;
    restaurarControles();
  }
}
function codigoLeido(texto) {
  if (!activo || bloqueado) return;
  const codigo = String(texto).trim().toUpperCase();
  if (!/^3B-\d{2}$/.test(codigo)) return;
  const numero = Number(codigo.slice(3));
  if (numero < 1 || numero > TOTAL_ALUMNOS || escaneados.has(codigo)) return;
  bloqueado = true;
  escaneados.add(codigo); ordenEscaneos.push(codigo);
  el('estado').textContent = esAsistencia()
    ? '❌ ' + codigo + ' — FALTA'
    : '❌ ' + codigo + ' — NO REALIZÓ';
  actualizarContador();
  if (navigator.vibrate) navigator.vibrate(100);
  setTimeout(() => {
    if (activo) el('estado').textContent = esAsistencia()
      ? 'Escanea al siguiente alumno AUSENTE'
      : 'Escanea al siguiente que NO realizó';
    bloqueado = false;
  },700);
}
function deshacerUltimo() {
  if (!activo || !ordenEscaneos.length) return;
  const codigo = ordenEscaneos.pop();
  escaneados.delete(codigo); bloqueado = false;
  el('estado').textContent = esAsistencia()
    ? '↩️ ' + codigo + ' corregido: PRESENTE'
    : '↩️ ' + codigo + ' corregido: REALIZÓ';
  actualizarContador();
}
function restaurarControles() {
  el('tipoRegistro').disabled = false;
  el('materia').disabled = false; el('actividad').disabled = false;
  el('iniciar').style.display = 'block'; el('finalizar').style.display = 'none';
  actualizarContador();
}
async function finalizarRevision() {
  if (!activo || enviando) return;
  const cantidad = escaneados.size;
  const totalSi = TOTAL_ALUMNOS - cantidad;
  const asistencia = esAsistencia();
  const mensaje = asistencia
    ? '¿Guardar asistencia del día?\n\nPresentes: '+totalSi+'\nFaltas: '+cantidad+
      '\n\nSi ya pasó lista hoy, esto REEMPLAZARÁ los estados de hoy con esta lista COMPLETA de ausentes.'
    : '¿Finalizar la revisión?\n\nRealizaron: '+totalSi+'\nNo realizaron: '+cantidad+
      '\n\nLos QR escaneados quedarán como NO ENTREGÓ.';
  if (!confirm(mensaje)) return;
  enviando = true; activo = false;
  el('finalizar').disabled = true;
  el('estado').textContent = 'Enviando datos a Google Sheets...';
  el('deshacer').style.display = 'none';
  try {
    if (lector) { try { await lector.stop(); } catch(e) {} lector = null; }
    await fetch(URL_APPS_SCRIPT, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({
        accion: asistencia ? 'asistencia' : 'finalizar',
        materia:el('materia').value,
        actividad:el('actividad').value.trim(),
        codigosEscaneados:Array.from(escaneados)
      })
    });
    el('estado').textContent = asistencia
      ? '📤 ASISTENCIA ENVIADA — verifica el guardado en la pestaña ASISTENCIA.'
      : '📤 ACTIVIDAD ENVIADA — verifica el guardado en REGISTRO.';
    el('aviso').textContent = 'El envío no confirma por sí solo que Google Sheets haya guardado los datos.';
    restaurarControles();
  } catch(error) {
    el('estado').textContent = 'No se pudo enviar. Revisa la conexión.';
    el('aviso').textContent = 'Los códigos siguen en memoria; no cierres esta página.';
    activo = true;
    el('finalizar').style.display = 'block';
  } finally {
    enviando = false;
    el('finalizar').disabled = false;
  }
}
actualizarContador();
</script>
</body>
</html>
